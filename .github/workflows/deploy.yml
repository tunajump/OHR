name: CI/CD Automated Test & Verification

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-and-verify:
    name: Run Automated Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Root Dependencies
        run: npm install --legacy-peer-deps

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm install --legacy-peer-deps

      - name: Install Backend Dependencies
        run: |
          cd backend
          npm install --legacy-peer-deps

      - name: Run Frontend Jest Test Suite
        run: |
          cd frontend
          npm test -- --watchAll=false --ci

      - name: Run Backend Stage Test Suite (Stages 1-7)
        run: |
          cd backend
          node test_stage_runner.js
