services:
  # 1. Backend API Web Service
  - type: web
    name: ohr-backend
    env: node
    plan: starter
    rootDir: backend
    buildCommand: npm install
    startCommand: node src/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: JWT_SECRET
        generateValue: true
      - key: DB_HOST
        value: localhost
      - key: DB_PORT
        value: 3306
      - key: DB_USER
        value: root
      - key: DB_PASSWORD
        value: ohr_secure_prod_password
      - key: DB_NAME
        value: ohr_production

  # 2. Frontend React SPA Static Site
  - type: web
    name: ohr-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && CI=false npm run build
    staticPublishPath: frontend/build
    routes:
      - type: rewrite
        source: /api/*
        destination: https://ohr-backend.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: REACT_APP_API_URL
        value: https://ohr-backend.onrender.com/api
      - key: CI
        value: false
